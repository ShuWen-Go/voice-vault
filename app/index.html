<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>听藏 · 会议录音 → 结构化纪要</title>
<style>
  :root { --red:#C00000; --red-dark:#7A0000; --red-bg:#FCEBEB; --ink:#2C2C2A; --muted:#5F5E5A;
          --line:#E3E1DA; --bg:#FAFAF8; }
  * { box-sizing:border-box; }
  body { margin:0; padding:0 16px 64px; background:var(--bg); color:var(--ink);
         font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; line-height:1.65; }
  .wrap { max-width:820px; margin:0 auto; }
  header.top { border-bottom:1px solid var(--line); margin-bottom:22px; }
  header.top .wrap { padding:20px 0 14px; }
  h1 { font-size:21px; font-weight:500; margin:0; }
  h1 span { color:var(--red); }
  .tagline { color:var(--muted); font-size:13px; margin:3px 0 0; }

  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:14px; }
  h2 { font-size:16px; font-weight:500; margin:0 0 10px; }
  h3 { font-size:14px; font-weight:500; margin:0 0 10px; color:var(--red-dark); }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .row.small { font-size:12.5px; margin-top:10px; }
  .spacer { flex:1; }
  .muted { color:var(--muted); }
  .empty { color:#A9A79F; font-size:13.5px; padding:14px; text-align:center; }
  .sum { color:var(--muted); font-size:13.5px; margin:10px 0 0;
         display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  button, .btn { font:inherit; font-size:13.5px; border-radius:8px; padding:8px 15px; cursor:pointer;
          border:1px solid var(--red); background:var(--red); color:#fff; text-decoration:none; display:inline-block; }
  button:hover, .btn:hover { background:var(--red-dark); border-color:var(--red-dark); }
  button.ghost, .btn.ghost { background:#fff; color:var(--red); }
  button.ghost:hover, .btn.ghost:hover { background:var(--red-bg); }
  button.danger { background:#fff; color:#A32D2D; border-color:#E5B4B4; }
  button.danger:hover { background:#FDF1F1; }
  .sm { padding:5px 11px; font-size:12.5px; }
  button:disabled { opacity:.45; cursor:not-allowed; }

  .timer { font-variant-numeric:tabular-nums; font-size:19px; color:var(--muted); }
  .timer.on { color:var(--red); }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#C9C7C0; margin-right:7px; }
  .dot.on { background:var(--red); }
  .quality { font-size:13px; color:var(--muted); }
  .quality select { font:inherit; font-size:13px; padding:4px 8px; border:1px solid var(--line);
                    border-radius:6px; background:#fff; color:var(--ink); }

  #drop { border:1.5px dashed #CFCDC6; border-radius:10px; padding:22px; text-align:center;
          color:var(--muted); font-size:13.5px; cursor:pointer; transition:.15s; margin-top:14px; }
  #drop.hot { border-color:var(--red); background:var(--red-bg); color:var(--red); }

  .bar { height:6px; background:#EFEDE6; border-radius:3px; overflow:hidden; margin-top:14px; display:none; }
  .bar i { display:block; height:100%; width:0; background:var(--red); transition:width .25s; }
  .progress { height:8px; background:#EFEDE6; border-radius:4px; overflow:hidden; margin:6px 0 12px; }
  .progress i { display:block; height:100%; width:0; background:var(--red); transition:width .3s; }
  .procDetail { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }

  .msg { margin-top:14px; font-size:13.5px; padding:11px 13px; border-radius:8px;
         background:var(--red-bg); color:var(--red-dark); display:none; white-space:pre-wrap; }
  .msg.err { background:#FDF1F1; border:1px solid #F0C4C4; color:#8A1F1F; display:block; }

  .badge { font-size:11.5px; padding:2px 8px; border-radius:20px; white-space:nowrap; }
  .badge.ok { background:#EAF3DE; color:#3B6D11; }
  .badge.warn { background:#FAEEDA; color:#854F0B; }
  .badge.muted { background:#F1EFE8; color:#5F5E5A; }
  .stats { font-size:13px; color:var(--muted); margin:0 0 12px 2px; }

  .meta { color:var(--muted); font-size:13px; margin:0; }
  .verify { font-size:12.5px; color:var(--muted); margin:8px 0 0; }

  ul.note { margin:0; padding-left:2px; list-style:none; }
  ul.note li { margin-bottom:9px; padding-left:14px; position:relative; font-size:13.5px; }
  ul.note li:before { content:"·"; position:absolute; left:2px; color:var(--red); font-weight:700; }
  ul.todo li:before { content:none; }
  ul.todo li { padding-left:0; }
  .tick { display:inline-block; width:13px; height:13px; border:1.5px solid #C9C7C0; border-radius:4px;
          margin-right:9px; vertical-align:-2px; }
  .at { font-family:ui-monospace,Consolas,monospace; font-size:12px; color:#A9A79F; margin-left:7px; }
  .tag { font-size:12px; background:#F4F2EC; color:var(--muted); padding:1px 7px; border-radius:5px; margin-left:7px; }
  table.nums { width:100%; border-collapse:collapse; font-size:13px; }
  table.nums th, table.nums td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); }
  table.nums th { color:var(--muted); font-weight:400; font-size:12.5px; }
  .foot { color:#A9A79F; font-size:12.5px; margin-top:22px; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>听<span>藏</span></h1>
    <p class="tagline">会议录音 → 结构化纪要 ｜ 语音转写在本地完成</p>
  </div>
</header>

<main class="wrap">

  <!-- ========== 视图 A：列表 + 入口 ========== -->
  <section id="view-list">
    <div class="card">
      <div class="row">
        <button id="recBtn">开始录音</button>
        <span class="timer" id="timer"><span class="dot" id="dot"></span><span id="clock">00:00</span></span>
        <span class="spacer"></span>
        <label class="quality">档位
          <select id="quality">
            <option value="medium" selected>medium（更准）</option>
            <option value="small">small（更快）</option>
          </select>
        </label>
      </div>
      <div id="drop">或把音频文件拖到这里（.m4a / .mp3 / .wav / .webm）</div>
      <input type="file" id="fileInput" accept="audio/*,video/mp4" hidden>
      <div class="bar" id="upBar"><i id="upBarIn"></i></div>
      <div class="msg" id="upMsg"></div>
      <p class="foot" style="margin-top:14px">录完/传完会自动转写并生成纪要 ｜ 22 分钟录音约需 13 分钟 —— 可以离开页面，服务端会继续跑</p>
    </div>

    <div class="stats" id="stats"></div>
    <div id="records"></div>
  </section>

  <!-- ========== 视图 B：处理中 ========== -->
  <section id="view-process" hidden>
    <div class="card">
      <h2 id="procTitle">正在处理…</h2>
      <div class="progress"><i id="procBar"></i></div>
      <div class="procDetail" id="procDetail"></div>
      <div class="row" style="margin-top:16px">
        <button id="cancelBtn" class="ghost sm">取消</button>
      </div>
      <div class="msg" id="procMsg"></div>
    </div>
  </section>

  <!-- ========== 视图 C：详情 ========== -->
  <section id="view-detail" hidden>
    <div class="row" style="margin-bottom:14px">
      <button id="backBtn" class="ghost sm">← 返回</button>
      <span class="spacer"></span>
      <button id="exportBtn" class="ghost sm">导出 Markdown</button>
      <button id="regenBtn" class="ghost sm">重新生成</button>
      <button id="delBtn" class="danger sm">删除</button>
    </div>
    <div class="card">
      <h2 id="dTitle"></h2>
      <p class="meta" id="dMeta"></p>
      <p class="verify" id="dVerify"></p>
    </div>
    <div id="dNote"></div>
  </section>

</main>

<script>
// ===== 基础工具 =====
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

async function api(path, opts) {
  const r = await fetch(path, opts);
  const text = await r.text();
  let data = null;
  try { data = JSON.parse(text); } catch { /* 非 JSON 交给下面兜 */ }
  if (!r.ok) throw new Error((data && data.error) || ('HTTP ' + r.status));
  return data;
}
const get = (p) => api(p);
const post = (p, body) => api(p, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body || {}) });

function fmtDur(sec) {
  if (!sec) return '—';
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  if (m >= 60) return Math.floor(m / 60) + ' 小时 ' + (m % 60) + ' 分';
  return s ? m + ' 分 ' + s + ' 秒' : m + ' 分钟';
}
function fmtClock(ms) {
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function fmtMmSs(sec) {
  if (sec == null) return '--:--';
  const s = Math.floor(sec);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return String(iso);
  const p = (x) => String(x).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function showMsg(el, text, isErr) { el.textContent = text; el.className = 'msg' + (isErr ? ' err' : ''); el.style.display = 'block'; }

// ===== 视图切换 =====
let currentHash = null;
let currentTaskId = null;
function showView(name) {
  for (const v of ['list', 'process', 'detail']) $('view-' + v).hidden = (v !== name);
  window.scrollTo(0, 0);
}

// ===== 上传（XHR：fetch 拿不到上传进度）=====
function uploadBlob(blob, filename, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/audio');
    xhr.setRequestHeader('Content-Type', blob.type || 'application/octet-stream');
    xhr.setRequestHeader('X-Filename', encodeURIComponent(filename));
    xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    xhr.onload = () => {
      let d = null;
      try { d = JSON.parse(xhr.responseText); } catch { /* 兜 */ }
      if (xhr.status === 200 && d) resolve(d);
      else reject(new Error((d && d.error) || ('上传失败 HTTP ' + xhr.status)));
    };
    xhr.onerror = () => reject(new Error('网络错误，上传中断'));
    xhr.send(blob);
  });
}

function withUpBar(fn) {
  $('upBar').style.display = 'block';
  return Promise.resolve()
    .then(fn)
    .finally(() => setTimeout(() => { $('upBar').style.display = 'none'; $('upBarIn').style.width = '0'; }, 600));
}
const onUp = (p) => { $('upBarIn').style.width = (p * 100).toFixed(1) + '%'; };

// ===== 列表 =====
async function loadList() {
  try {
    const d = await get('/api/records');
    $('stats').textContent = '共 ' + d.count + ' 场 ｜ 总时长 ' + fmtDur(d.stats.totalDurationSeconds) +
      ' ｜ 已有纪要 ' + d.stats.structured;
    const box = $('records');
    if (!d.items.length) {
      box.innerHTML = '<div class="card empty">还没有记录 —— 录一段或传一个试试。</div>';
      return;
    }
    box.innerHTML = d.items.map(cardHtml).join('');
    box.querySelectorAll('[data-open]').forEach((el) => { el.onclick = () => openDetail(el.dataset.open); });
  } catch (err) {
    $('records').innerHTML = '<div class="card empty">列表加载失败：' + esc(err.message) + '</div>';
  }
}

function cardHtml(it) {
  const b = { structured: ['已生成纪要', 'ok'], transcribed: ['已转写', 'warn'], uploaded: ['仅音频', 'muted'] }[it.status] || ['—', 'muted'];
  return '' +
  '<div class="card">' +
    '<div class="row">' +
      '<span class="badge ' + b[1] + '">' + b[0] + '</span>' +
      '<strong style="font-weight:500">' + esc(it.title || it.filename || it.hash) + '</strong>' +
      '<span class="spacer"></span>' +
      '<span class="muted" style="font-size:13px">' + fmtDur(it.durationSeconds) + '</span>' +
    '</div>' +
    (it.summary ? '<p class="sum">' + esc(it.summary) + '</p>' : '') +
    '<div class="row small">' +
      '<span class="muted">' + (it.meetingType ? esc(it.meetingType) + ' · ' : '') + fmtTime(it.updatedAt) + '</span>' +
      '<span class="spacer"></span>' +
      '<button class="ghost sm" data-open="' + it.hash + '">查看</button>' +
      '<a class="btn ghost sm" href="/api/record/' + it.hash + '/export?download=1">导出</a>' +
    '</div>' +
  '</div>';
}

// ===== 主流程：上传 → 转写 → 纪要 =====
function setProc(title, pct, detail) {
  $('procTitle').textContent = title;
  $('procBar').style.width = (pct || 0) + '%';
  $('procDetail').textContent = detail || '';
}

function failProc(msgText) {
  showMsg($('procMsg'), '❌ ' + msgText, true);
  $('cancelBtn').textContent = '返回列表';
  $('cancelBtn').onclick = () => { showView('list'); loadList(); };
}

async function pollTask(id, onTick) {
  for (let i = 0; i < 3000; i++) {
    const t = await get('/api/transcribe/' + id);
    onTick(t);
    if (t.status === 'done') return t;
    if (t.status === 'failed') throw new Error(t.error || '转写失败');
    if (t.status === 'canceled') throw new Error('已取消');
    await sleep(2000);
  }
  throw new Error('等待时间过长，已停止轮询（服务端可能仍在跑）');
}

async function runPipeline(hash, quality) {
  showView('process');
  $('procMsg').style.display = 'none';
  $('cancelBtn').textContent = '取消';
  $('cancelBtn').onclick = cancelCurrent;
  setProc('正在准备…', 0, '');

  try {
    const task = await post('/api/transcribe', { hash, quality });
    currentTaskId = task.id;

    await pollTask(task.id, (t) => {
      if (t.stage === 'loading_model') return setProc('正在加载模型…', 0, '首次加载约 3 秒');
      const pct = t.percent || 0;
      setProc('正在转写…', pct,
        pct + '%　｜　已处理 ' + fmtMmSs(t.doneSeconds) + ' / ' + fmtMmSs(t.totalSeconds) + '　｜　' + (t.segments || 0) + ' 段');
    });

    currentTaskId = null;
    setProc('正在生成纪要…', 100, '模型按字段归纳，约 15 秒');
    await post('/api/structure', { hash });
    await openDetail(hash);
  } catch (err) {
    currentTaskId = null;
    failProc(err.message);
  }
}

async function cancelCurrent() {
  if (!currentTaskId) { showView('list'); loadList(); return; }
  try { await api('/api/transcribe/' + currentTaskId, { method: 'DELETE' }); } catch { /* 忽略 */ }
  currentTaskId = null;
  failProc('任务已取消');
}

// ===== 录音 =====
const recBtn = $('recBtn'), timerEl = $('timer'), dotEl = $('dot'), clockEl = $('clock');
let recorder = null, chunks = [], tick = null, startedAt = 0;

recBtn.addEventListener('click', async () => {
  if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (err) { showMsg($('upMsg'), '❌ 拿不到麦克风权限：' + err.message, true); return; }

  const prefer = 'audio/webm;codecs=opus';
  recorder = new MediaRecorder(stream, MediaRecorder.isTypeSupported(prefer) ? { mimeType: prefer } : undefined);
  chunks = [];
  recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };

  recorder.onstop = async () => {
    stream.getTracks().forEach((t) => t.stop());
    clearInterval(tick);
    recBtn.textContent = '开始录音';
    dotEl.classList.remove('on');
    timerEl.classList.remove('on');
    clockEl.textContent = '00:00';

    const type = recorder.mimeType || 'audio/webm';
    const blob = new Blob(chunks, { type });
    const ext = type.includes('webm') ? 'webm' : (type.includes('mp4') ? 'm4a' : 'bin');
    const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    const quality = $('quality').value;
    try {
      const r = await withUpBar(() => uploadBlob(blob, '录音-' + stamp + '.' + ext, onUp));
      await runPipeline(r.hash, quality);
    } catch (err) {
      showMsg($('upMsg'), '❌ ' + err.message, true);
    }
  };

  recorder.start();
  startedAt = Date.now();
  recBtn.textContent = '停止并处理';
  dotEl.classList.add('on');
  timerEl.classList.add('on');
  clockEl.textContent = '00:00';
  tick = setInterval(() => { clockEl.textContent = fmtClock(Date.now() - startedAt); }, 200);
  showMsg($('upMsg'), '正在录音…说完点「停止并处理」');
});

// ===== 文件上传 =====
const drop = $('drop'), fileInput = $('fileInput');

function handleFile(file) {
  if (!file) return;
  const quality = $('quality').value;
  (async () => {
    try {
      const r = await withUpBar(() => uploadBlob(file, file.name, onUp));
      await runPipeline(r.hash, quality);
    } catch (err) {
      showMsg($('upMsg'), '❌ ' + err.message, true);
    }
  })();
}

drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { handleFile(fileInput.files[0]); fileInput.value = ''; });
['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('hot'); }));
['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('hot'); }));
drop.addEventListener('drop', (e) => handleFile(e.dataTransfer.files[0]));

// ===== 详情 =====
async function openDetail(hash) {
  showView('detail');
  currentHash = hash;
  $('dNote').innerHTML = '<div class="card empty">加载中…</div>';
  try {
    const rec = await get('/api/record/' + hash + '?full=1');
    $('dTitle').textContent = rec.title || rec.filename || hash;
    const bits = [
      rec.meetingType ? '类型 ' + rec.meetingType : null,
      '时长 ' + fmtDur(rec.durationSeconds),
      rec.transcript && rec.transcript.quality ? '转写 ' + rec.transcript.quality + ' 档' : null,
      rec.transcript && rec.transcript.rtf ? 'RTF ' + rec.transcript.rtf : null,
      rec.correctionChanged ? '纠错 ' + rec.correctionChanged + ' 处' : null,
    ].filter(Boolean);
    $('dMeta').textContent = bits.join('  ｜  ');

    const vs = rec.verify;
    $('dVerify').textContent = vs
      ? '核验：时间戳 ' + (vs.badAt === 0 ? '全部命中' : '可疑 ' + vs.badAt + ' 处') +
        ' ｜ 数字存疑 ' + (vs.inventedNumbers || 0) + ' 处 ｜ 负责人为推测 ' + (vs.inferredOwners || 0) + ' 处'
      : '';

    $('dNote').innerHTML = renderNote(rec);
  } catch (err) {
    $('dNote').innerHTML = '<div class="card empty">加载失败：' + esc(err.message) + '</div>';
  }
}

function renderNote(rec) {
  const det = rec.noteDetail;
  if (!det || !det.note) {
    return '<div class="card empty">这份记录还没有纪要。<br>点右上「重新生成」试试。</div>';
  }
  const n = det.note;
  const titles = rec.blockTitles || {};
  const order = rec.blockOrder || ['keyPoints', 'todos', 'decisions', 'numbers', 'openQuestions', 'risks'];
  const parts = [];

  if (n.summary) {
    parts.push('<div class="card"><h3>30 秒速览</h3><p style="margin:0;font-size:13.5px">' + esc(n.summary) + '</p></div>');
  }
  for (const key of order) {
    const body = renderBlock(key, n);
    if (body) parts.push('<div class="card"><h3>' + esc(titles[key] || key) + '</h3>' + body + '</div>');
  }
  parts.push('<p class="foot">每条内容都标注了对应的录音位置（mm:ss）｜ 结论类字段由 AI 归纳，建议核对</p>');
  return parts.join('');
}

function renderBlock(key, n) {
  const items = n[key] || [];
  if (!items.length) return '';

  if (key === 'keyPoints') {
    return '<ul class="note">' + items.map((p) =>
      '<li><strong>' + esc(p.topic || '') + '</strong>' + (p.topic ? '：' : '') + esc(p.detail || '') +
      '<span class="at">' + esc(p.at || '') + '</span></li>').join('') + '</ul>';
  }
  if (key === 'numbers') {
    return '<table class="nums"><thead><tr><th>数值</th><th>含义</th><th>位置</th></tr></thead><tbody>' +
      items.map((x) => '<tr><td>' + esc(x.value || '') + '</td><td>' + esc(x.meaning || '') +
        '</td><td class="at">' + esc(x.at || '') + '</td></tr>').join('') + '</tbody></table>';
  }
  if (key === 'todos') {
    return '<ul class="note todo">' + items.map((t) => {
      const tags = [];
      if (t.owner) tags.push('负责人：' + esc(t.owner));
      if (t.due) tags.push('期限：' + esc(t.due));
      return '<li><span class="tick"></span>' + esc(t.what || '') +
        (tags.length ? '<span class="tag">' + tags.join(' · ') + '</span>' : '') +
        '<span class="at">' + esc(t.at || '') + '</span></li>';
    }).join('') + '</ul>';
  }
  return '<ul class="note">' + items.map((it) =>
    '<li>' + esc(it.what != null ? it.what : (it.detail || '')) + '<span class="at">' + esc(it.at || '') + '</span></li>').join('') + '</ul>';
}

// ===== 详情页按钮 =====
$('backBtn').onclick = () => { showView('list'); loadList(); };
$('exportBtn').onclick = () => { if (currentHash) window.location.href = '/api/record/' + currentHash + '/export?download=1'; };
$('regenBtn').onclick = async () => {
  if (!currentHash) return;
  if (!confirm('重新生成会再调用一次模型（约 15 秒，费用极小）。继续？')) return;
  showView('process');
  $('procMsg').style.display = 'none';
  $('cancelBtn').textContent = '返回列表';
  $('cancelBtn').onclick = () => { showView('list'); loadList(); };
  setProc('正在重新生成纪要…', 100, '模型按字段归纳，约 15 秒');
  try {
    await post('/api/structure', { hash: currentHash, force: true });
    await openDetail(currentHash);
  } catch (err) {
    failProc(err.message);
  }
};
$('delBtn').onclick = async () => {
  if (!currentHash) return;
  if (!confirm('删除后这条记录的音频、转写、纪要都会被移除，且无法恢复。确定删除？')) return;
  try {
    const r = await api('/api/record/' + currentHash, { method: 'DELETE' });
    alert('已删除（' + r.count + ' 个文件）');
    currentHash = null;
    showView('list');
    loadList();
  } catch (err) {
    alert('删除失败：' + err.message);
  }
};

// ===== 启动 =====
loadList();
</script>
</body>
</html>
